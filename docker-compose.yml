services:
  webslicer:
    build:
      context: .
      args:
        PRUSASLICER_VERSION: "2.9.6"
    image: webslicer:latest
    container_name: webslicer
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - webslicer-data:/data
    environment:
      - PORT=8080
      - DATA_DIR=/data
      # Max parallel slicing jobs
      - MAX_JOBS=2
      # Optional: restrict upload size (bytes)
      - MAX_UPLOAD_BYTES=524288000

volumes:
  webslicer-data:
