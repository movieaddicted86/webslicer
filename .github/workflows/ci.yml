name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # The browser net (T-030): the real image, the real PrusaSlicer CLI, the fixture data dir.
  # The PrusaSlicer layer is the expensive part of the image (~3 min) – it is built as its own
  # target and cached in the GHA cache, so a normal run only rebuilds the app layers.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - name: Build the image
        # `mode=max` keeps the intermediate layers too, so the PrusaSlicer stage (~3 min, the
        # download of the AppImage) is a cache hit on every run after the first
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: webslicer:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the app with the fixture data
        run: |
          mkdir -p "$RUNNER_TEMP/e2e/library"
          cp -r e2e/fixtures/data "$RUNNER_TEMP/e2e/data"
          docker run -d --name e2e \
            -p 8080:8080 \
            -v "$RUNNER_TEMP/e2e/data:/data" \
            -v "$RUNNER_TEMP/e2e/library:/library" \
            webslicer:e2e
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:8080/api/health
      - name: Run the E2E suite
        run: npm run e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Server log (on failure)
        if: failure()
        run: docker logs e2e --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
      - name: Stop the container
        if: always()
        run: docker rm -f e2e || true
