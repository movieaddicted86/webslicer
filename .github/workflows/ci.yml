name: CI

on:
  push:
  pull_request:

# T-057: a new push to the same branch cancels the run it supersedes, so a stale E2E run does not
# occupy the runners (and the eight-minute budget) for nothing. `main` is never cancelled: its runs
# are the history the branch runs are compared against.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# W6: read-only by default. Neither job publishes anything, so every token this workflow hands to a
# step (including a dependency's install script or a pulled action) can only read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run version:check
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # The browser net (T-030): the real image, the real PrusaSlicer CLI, the fixture data dir, and the
  # mock print host the send spec uploads to (a sibling container on a private network – no real
  # printer, no host port).
  #
  # T-057 changed how the shards are set up:
  # - the **image is built once** in `build` and handed over through the GHA build cache. A `docker
  #   save` artifact would be ~430 MB per shard (1.3 GB uncompressed); restoring the cached layers is
  #   smaller and does not need an upload. The three shards only `--load` the cached result.
  # - the **suite runs inside the official Playwright image**, whose tag is derived from the
  #   `@playwright/test` version in `package.json` (one place, and Dependabot's `playwright` group
  #   moves the package and this tag together). Browsers and their system libraries are preinstalled,
  #   so the `npx playwright install --with-deps` step – 11 s warm but 12 min on a cold runner – is
  #   gone. The container gets host networking (the app publishes 8080) and the mock's log directory.
  # - **two workers per shard**: the specs were isolated for it (a fresh browser context per test, a
  #   per-context autosave id, and the tests that create printers or read the mock's upload log take
  #   the `server-state` test lock). The shard weights follow the measured file times after the
  #   shared-slice change.
  # A push that only touches docs (Markdown, docs/, LICENSE) skips the E2E shards; `check` (lint,
  # format incl. Markdown, unit tests) always runs. Unknown base (new branch, force push) → run all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          base="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then base="${{ github.event.pull_request.base.sha }}"; fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qvE '(\.md$|^docs/|^LICENSE$)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The one build of the app image (T-057). `mode=max` keeps the intermediate layers too, so the
  # PrusaSlicer stage (~3 min, the download of the AppImage) is a cache hit on every run after the
  # first. This job is the only writer of the `e2e` cache scope: the shards read it.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the app image into the build cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=e2e
          cache-to: type=gha,mode=max,scope=e2e
  e2e:
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # the job only loads images and runs tests; the GHA cache needs no repository write scope
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/3', '2/3', '3/3']
    # a shard runs ~⅓ of the suite; the cap is a backstop against a hung slice, not the target
    timeout-minutes: 30
    env:
      E2E_BASE_URL: http://localhost:8080
      E2E_MOCK_URL: http://mock-host:8160
      # measured on this branch after the shared-slice change (see `.ai/reports/T-057.md`)
      PWTEST_SHARD_WEIGHTS: 1:1:1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-buildx-action@v3
      - name: Load the image built by `build`
        # cache-from only: the build job owns the scope, and a cached layer set is restored without
        # running the PrusaSlicer stage again
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: webslicer:e2e
          cache-from: type=gha,scope=e2e
      - name: Build the mock print host
        run: docker build -t webslicer-mock-host:e2e e2e/mock-host
      - name: Resolve the Playwright image tag
        # the single place is `package.json`; Dependabot's `playwright` group bumps the package and
        # the image tag follows from it
        id: pw
        run: echo "image=mcr.microsoft.com/playwright:v$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Start the app and the mock print host
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e2e/library" "$RUNNER_TEMP/e2e/mock"
          cp -r e2e/fixtures/data "$RUNNER_TEMP/e2e/data"
          # both images run as `node` (uid 1000), the runner's temp dirs belong to the runner user:
          # without this the server cannot write its data dir and exits before it listens
          chmod -R a+rwX "$RUNNER_TEMP/e2e"
          docker network create e2e-net
          docker run -d --name mock-host --network e2e-net --network-alias mock-host \
            -v "$RUNNER_TEMP/e2e/mock:/mock-data" webslicer-mock-host:e2e
          docker run -d --name e2e --network e2e-net \
            -p 8080:8080 \
            -v "$RUNNER_TEMP/e2e/data:/data" \
            -v "$RUNNER_TEMP/e2e/library:/library" \
            webslicer:e2e
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:8080/api/health >/dev/null 2>&1; then
              echo "the app answered after ~$((i * 2)) s"
              curl -fsS http://localhost:8080/api/health
              break
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' e2e 2>/dev/null || echo false)" != "true" ]; then
              echo "the app container exited:"
              docker logs e2e || true
              exit 1
            fi
            if [ "$i" = 120 ]; then
              echo "the app did not answer within 240 s:"
              docker logs --tail 100 e2e || true
              exit 1
            fi
            sleep 2
          done
          # the app has to resolve the mock by name before the send spec runs
          docker exec e2e node -e "fetch('http://mock-host:8160/api/version').then(r=>r.json()).then(j=>console.log('mock host:',j.server)).catch(e=>{console.error(e);process.exit(1)})"
      - run: npm ci
      - name: Run the E2E suite (shard ${{ matrix.shard }})
        # The suite runs in the Playwright image (browsers preinstalled), against the workspace the
        # runner already installed. The mock's log directory is mounted, host networking reaches the
        # published app port, and the container runs as the runner user so the reports the later
        # steps read stay owned by it.
        env:
          E2E_MOCK_DIR: ${{ runner.temp }}/e2e/mock
        run: |
          set -euo pipefail
          # `--ipc=host`: the browser's shared memory – the default 64 MB /dev/shm is too small for
          # several Chromium instances and crashes them (the documented Playwright container setup)
          docker run --rm --network host --ipc=host \
            --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$GITHUB_WORKSPACE:/work" -w /work \
            -v "$E2E_MOCK_DIR:/mock-data" \
            -e CI -e E2E_BASE_URL -e E2E_MOCK_URL -e E2E_MOCK_DIR=/mock-data -e PWTEST_SHARD_WEIGHTS \
            "${{ steps.pw.outputs.image }}" \
            npx playwright test --shard=${{ matrix.shard }}
      - name: Server log (on failure)
        if: failure()
        run: |
          docker logs e2e --tail 200 || true
          docker logs mock-host --tail 100 || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # one report per shard: the three jobs run on different runners, so the file sets cannot
          # be merged and must not overwrite each other
          name: playwright-report-shard-${{ strategy.job-index }}
          path: |
            playwright-report
            test-results
          retention-days: 14
      - name: Stop the containers
        if: always()
        run: |
          docker rm -f e2e mock-host || true
          docker network rm e2e-net || true
