# W6: dependency updates as small, grouped pull requests.
#
# npm: the three workspaces share one lock file at the root, so one entry covers the whole repo.
# github-actions: the workflow uses checkout, setup-node, buildx, cache and upload-artifact; a bump of
# one of them should arrive with the others.
#
# Two kinds of group, per ecosystem:
# - the **package groups** below move packages that must stay in step regardless of the bump size
#   (Vite + plugin-react, three + its types, React and its types, the ESLint stack). They include
#   `major`, so a major arrives as one reviewable PR instead of being split across the generic group.
# - `npm-minor-patch` catches everything else. Group order matters: Dependabot assigns an update to
#   the first matching group, so the package groups must stay **above** it.
#
# `typescript` is grouped alone: a major there is a decision of its own (Q1 pins TS 6 until
# typescript-eslint supports TS 7).
version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      three:
        applies-to: version-updates
        patterns:
          - 'three'
          - '@types/three'
      react:
        applies-to: version-updates
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      vite:
        applies-to: version-updates
        patterns:
          - 'vite'
          - '@vitejs/plugin-react'
      # T-057: CI runs the E2E suite in `mcr.microsoft.com/playwright:v<version>`, derived from this
      # package at run time – so a bump of the package moves the container too, in one PR.
      playwright:
        applies-to: version-updates
        patterns:
          - '@playwright/test'
          - 'playwright'
          - 'playwright-core'
      typescript:
        applies-to: version-updates
        patterns:
          - 'typescript'
      eslint:
        applies-to: version-updates
        patterns:
          - 'eslint'
          - 'eslint-*'
          - '@eslint/*'
          - 'typescript-eslint'
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'deps'
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    commit-message:
      prefix: 'ci'
    labels:
      - dependencies
