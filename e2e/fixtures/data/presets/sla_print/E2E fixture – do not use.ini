# E2E fixture marker (T-030). This user **SLA print** preset exists only in e2e/fixtures/data and is
# what `global-setup.ts` looks for: an app whose data dir does not carry it is not a fixture instance,
# and the suite refuses to run against it (it writes presets, printers and autosave files, and deletes
# every job). SLA on purpose: the app's FFF UI never lists SLA presets, so the marker cannot be
# auto-selected as the working print settings the way a user *print* preset would be. No spec uses it.
inherits = - default SLA -
