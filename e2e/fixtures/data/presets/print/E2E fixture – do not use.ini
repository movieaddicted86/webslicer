# E2E fixture marker (T-030). This user print preset exists only in e2e/fixtures/data and is what
# `global-setup.ts` looks for: an app whose data dir does not carry it is not a fixture instance, and
# the suite refuses to run against it (it writes presets, printers and autosave files, and deletes
# every job). Nothing in the specs selects this preset.
inherits = - default FFF -
